name: Validate Context Audit

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Matches the compatibility documented in your SKILL.md
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        # tiktoken is included to ensure the exact-token fallback is tested
        pip install -e .[dev]

    - name: Execute Test Suite
      # Assumes you placed the Pytest file generated earlier into a 'tests/' directory
      run: |
        pytest tests/ -v