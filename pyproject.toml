[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "context-engineering"
version = "1.1.0"
description = "Diagnose and improve context usage in AI agent sessions."
authors = [
    { name = "Himadri Ganguly", email = "himadri.tech@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
exact-tokens = [
    "tiktoken>=0.7.0"
]
dev = [
    "pytest>=7.0",
    "pyyaml>=6.0",
    "tiktoken>=0.7.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["skills/context_engineering/scripts"]